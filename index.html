<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Scrapbook ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap');

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:"Plus Jakarta Sans",sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  background:#c69a6d;
}

/* ================= CORKBOARD (scrollable) ================= */

.board{
  position:relative;
  width:min(100vw,460px);
  height:100%;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
  cursor:pointer;

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:38px;
  padding:11% 6% 30vh;

  background:
    radial-gradient(#00000012 1px, transparent 1.4px),
    radial-gradient(#ffffff10 1px, transparent 1.4px);
  background-size:14px 14px, 14px 14px;
  background-position:0 0, 7px 7px;
  background-color:#c69a6d;
  box-shadow:inset 0 0 80px #5b3d1e55;
}

.board::-webkit-scrollbar{
  display:none;
}

/* ================= HINT (fixed) ================= */

.hint{
  position:fixed;
  bottom:18px;
  left:0;
  right:0;
  text-align:center;
  color:#fff5e6;
  font-size:12px;
  letter-spacing:.5px;
  text-shadow:0 1px 3px #00000055;
  z-index:30;
  pointer-events:none;
  transition:opacity .4s ease;
}

/* ================= TITLE CARD ================= */

.title-card{
  flex-shrink:0;
  background:#fffdf6;
  padding:20px 28px;
  border-radius:3px;
  box-shadow:0 12px 26px #00000033;
  text-align:center;
  position:relative;
  transform:rotate(-2deg);
}

.title-card .tape{
  position:absolute;
  top:-12px;
  left:50%;
  transform:translateX(-50%) rotate(-3deg);
  width:70px;
  height:24px;
  background:#ffffffb0;
  border:1px solid #ffffff80;
}

.title-card h1{
  margin:0;
  font-family:"Patrick Hand",cursive;
  font-size:26px;
  color:#3a2a1a;
}

.title-card p{
  margin:5px 0 0;
  font-size:11px;
  color:#8a7050;
  letter-spacing:.5px;
}

/* ================= POLAROID (besar, alur vertikal) ================= */

.polaroid{
  flex-shrink:0;
  width:82vw;
  max-width:340px;
  background:#fffdf6;
  padding:14px 14px 34px;
  border-radius:2px;
  box-shadow:0 16px 30px #00000045;
  position:relative;

  opacity:0;
  transform:scale(.4) rotate(0deg);
  height:0;
  margin:0;
  padding-top:0;
  padding-bottom:0;
  overflow:hidden;
  transition:
    opacity .5s ease,
    transform .55s cubic-bezier(.2,.9,.25,1.25);
}

.polaroid.show{
  opacity:1;
  height:auto;
  padding:14px 14px 34px;
  margin:0;
}

.polaroid:nth-child(odd){ transform:scale(.4) rotate(0deg); }
.polaroid.show:nth-child(odd){ transform:scale(1) rotate(-2.5deg); }
.polaroid.show:nth-child(even){ transform:scale(1) rotate(2.5deg); }

.polaroid img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#e8e0d2;
  border-radius:1px;
}

.polaroid .tape{
  position:absolute;
  top:-11px;
  left:50%;
  transform:translateX(-50%) rotate(-4deg);
  width:60px;
  height:24px;
  background:#ffffffa8;
  border:1px solid #ffffff70;
}

.polaroid:nth-child(even) .tape{
  transform:translateX(-50%) rotate(4deg);
}

/* ================= FINAL NOTE ================= */

.final-note{
  flex-shrink:0;
  width:86vw;
  max-width:340px;
  background:#fffdf6;
  padding:26px 24px;
  border-radius:3px;
  box-shadow:0 20px 45px #00000050;
  text-align:left;
  position:relative;

  opacity:0;
  height:0;
  padding-top:0;
  padding-bottom:0;
  overflow:hidden;
  transform:scale(.4) rotate(-3deg);
  transition:
    opacity .6s ease,
    transform .6s cubic-bezier(.2,.9,.25,1.2);
}

.final-note.show{
  opacity:1;
  height:auto;
  padding:26px 24px;
  transform:scale(1) rotate(-1.5deg);
}

.final-note .tape{
  position:absolute;
  top:-13px;
  left:50%;
  transform:translateX(-50%) rotate(2deg);
  width:76px;
  height:24px;
  background:#ffffffb5;
  border:1px solid #ffffff80;
}

.final-note p{
  font-family:"Patrick Hand",cursive;
  font-size:18px;
  line-height:1.55;
  color:#2c2013;
  margin:0 0 14px;
}

.final-note .sign{
  text-align:right;
  font-weight:700;
}

.replay-btn{
  display:block;
  margin:12px auto 0;
  border:1px solid #8a705055;
  background:transparent;
  color:#6b5238;
  font-size:11px;
  padding:9px 20px;
  border-radius:20px;
  cursor:pointer;
  font-family:"Plus Jakarta Sans",sans-serif;
}

/* ================= HEART ================= */

.heart{
  position:fixed;
  bottom:-30px;
  font-size:18px;
  opacity:.8;
  animation:rise linear forwards;
  pointer-events:none;
  z-index:50;
  color:#fff;
}

@keyframes rise{
  from{ transform:translateY(0) rotate(0); opacity:0; }
  15%{ opacity:.8; }
  to{ transform:translateY(-105vh) rotate(20deg); opacity:0; }
}
</style>
</head>

<body>

<audio id="bgMusic" src="music.mp3" preload="auto" loop></audio>

<div class="board" id="board">

  <div class="title-card" id="titleCard">
    <div class="tape"></div>
    <h1>our little scrapbook</h1>
    <p>tap layar untuk mulai nempel kenangan</p>
  </div>

</div>

<div class="hint" id="hint">tap layar untuk lanjut</div>

<script>

/* =====================================================
   FOTO — ganti src & caption sesuai foto & momen aslimu.
   Tinggal tambah/kurangi objek di array ini kalau mau
   jumlah fotonya beda dari 10.
   ===================================================== */

const PHOTOS = [
  "foto1.jpg",
  "foto2.jpg",
  "foto3.jpg",
  "foto4.jpg",
  "foto5.jpg",
  "foto6.jpg",
  "foto7.jpg",
  "foto8.jpg",
  "foto9.jpg",
  "foto10.jpg"
];

const board = document.getElementById("board");
const hint = document.getElementById("hint");
const titleCard = document.getElementById("titleCard");

/* Bangun elemen polaroid dari array PHOTOS */
const polaroidEls = PHOTOS.map(function(src){
  const el = document.createElement("div");
  el.className = "polaroid";
  el.innerHTML =
    '<div class="tape"></div>' +
    '<img src="' + src + '" alt="">';
  board.appendChild(el);
  return el;
});

/* Catatan penutup, ditambahkan setelah semua foto */
const finalNote = document.createElement("div");
finalNote.className = "final-note";
finalNote.id = "finalNote";
finalNote.innerHTML =
  '<div class="tape"></div>' +
  '<p>Tanpa kamu tahu,<br>' +
  'tanpa kamu sadari,<br>' +
  'aku banyak berusaha<br>' +
  'hanya untuk sekadar<br>' +
  'tertangkap oleh matamu</p>' +
  '<p class="sign">— Gipa ♡</p>' +
  '<button class="replay-btn" id="replayBtn">↻ ulangi</button>';
board.appendChild(finalNote);

const steps = [titleCard].concat(polaroidEls, [finalNote]);
let step = 0;

const bgMusic = document.getElementById("bgMusic");
let musicStarted = false;

function showStep(i){
  const el = steps[i];
  el.classList.add("show");

  requestAnimationFrame(function(){
    el.scrollIntoView({ behavior:"smooth", block:"center" });
  });

  if(i > 0) spawnHeart();
  if(i === steps.length - 1){
    hint.style.opacity = "0";
  }
}

showStep(0);

/* Coba putar musik langsung begitu halaman terbuka.
   Kalau browser memblokir autoplay bersuara, musik akan
   otomatis mulai begitu ada tap pertama (lihat handler di
   bawah) — ini fallback wajib karena sebagian besar browser
   memang tidak mengizinkan suara diputar sebelum ada interaksi. */
bgMusic.play().then(function(){
  musicStarted = true;
}).catch(function(){
  musicStarted = false;
});

board.addEventListener("click", function(e){
  if(e.target.closest(".replay-btn")) return;

  if(!musicStarted){
    bgMusic.play().catch(function(){});
    musicStarted = true;
  }

  if(step < steps.length - 1){
    step++;
    showStep(step);
  }
});

board.addEventListener("click", function(e){
  if(!e.target.closest(".replay-btn")) return;

  bgMusic.pause();
  bgMusic.currentTime = 0;
  musicStarted = false;

  steps.forEach(function(s){ s.classList.remove("show"); });
  step = 0;
  hint.style.opacity = "1";
  board.scrollTo({ top:0, behavior:"smooth" });
  showStep(0);
});

function spawnHeart(){
  const h = document.createElement("div");
  h.className = "heart";
  h.textContent = Math.random() > 0.5 ? "♡" : "♥";
  h.style.left = (10 + Math.random() * 80) + "vw";
  h.style.animationDuration = (5 + Math.random() * 4) + "s";
  h.style.fontSize = (14 + Math.random() * 13) + "px";
  document.body.appendChild(h);
  setTimeout(function(){ h.remove(); }, 9500);
}

</script>
</body>
</html>
