<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Patrick+Hand&display=swap');

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:"Plus Jakarta Sans",sans-serif;
  background:#fff;
}

body{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= STAGE ================= */

.stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:8vw;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .6s ease;
}

.stage.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

.stage.bg-white{
  background:#fff;
}

.stage.bg-black{
  background:#000;
}

/* ================= START ================= */

#stageStart p{
  color:#9a9a9a;
  font-size:15px;
  letter-spacing:.5px;
  font-weight:500;
}

/* ================= SENTENCE ================= */

#stageSentence .sentence-text{
  color:#1a1a1a;
  font-size:19px;
  font-weight:500;
  line-height:1.6;
  max-width:520px;
  opacity:0;
  transform:translateY(8px);
  transition:opacity .5s ease,transform .5s ease;
}

#stageSentence .sentence-text.show{
  opacity:1;
  transform:translateY(0);
}

.tap-hint{
  position:absolute;
  bottom:9%;
  left:0;
  right:0;
  color:#c7c7c7;
  font-size:11px;
  letter-spacing:.5px;
}

/* ================= BLACK ================= */

#stageBlack::after{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  opacity:.6;
}

/* ================= LYRICS ================= */

#stageLyric{
  overflow:hidden;
  cursor:default;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

.lyric-wrap{
  position:relative;
  max-width:640px;
  padding:20px;
}

.lyric-line{
  font-size:9vw;
  font-weight:800;
  line-height:1.05;
  color:#111;
  opacity:0;
  transform:scale(.7);
  display:inline-block;
  transition:
    opacity .5s ease,
    transform .5s cubic-bezier(.2,.9,.3,1.2);
}

.lyric-line.show{
  opacity:1;
  transform:scale(1);
}

@media(min-width:600px){
  .lyric-line{
    font-size:52px;
  }
}

/* ================= INSTAGRAM STYLE ================= */

#stagePhoto{
  background:#fff;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.ig-post{
  width:min(100%,430px);
  height:100%;
  background:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

/* Header */

.ig-header{
  height:58px;
  display:flex;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid #eee;
  flex-shrink:0;
}

.profile{
  width:34px;
  height:34px;
  border-radius:50%;
  background:linear-gradient(135deg,#ffb6c1,#d9a7ff,#8fd3ff);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:700;
  font-size:14px;
  margin-right:10px;
}

.username{
  font-size:13px;
  font-weight:700;
  color:#222;
}

/* Photo */

.ig-photo-area{
  width:100%;
  position:relative;
  background:#f4f4f4;
  overflow:hidden;
}

#photoImg{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  opacity:0;
  transform:scale(1.03);
  transition:
    opacity .45s ease,
    transform .55s ease;
}

#photoImg.show{
  opacity:1;
  transform:scale(1);
}

/* Dots */

.photo-dots{
  position:absolute;
  bottom:10px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:5px;
}

.photo-dots span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#ffffffaa;
  transition:.25s ease;
}

.photo-dots span.on{
  background:#fff;
  transform:scale(1.15);
}

/* Arrow */

.photo-arrow{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  width:30px;
  height:30px;
  border-radius:50%;
  background:#00000055;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  opacity:.8;
}

/* Bottom */

.ig-bottom{
  padding:10px 14px 12px;
  text-align:left;
}

.ig-icons{
  display:flex;
  align-items:center;
  gap:15px;
  font-size:25px;
  margin-bottom:8px;
}

.ig-icons span{
  cursor:pointer;
}

.ig-caption{
  font-size:13px;
  line-height:1.5;
  color:#222;
  min-height:40px;
}

.ig-caption b{
  margin-right:5px;
}

.ig-date{
  color:#999;
  font-size:10px;
  margin-top:7px;
}

/* Replay */

.replay-btn{
  margin:12px auto 0;
  border:1px solid #ddd;
  background:#fff;
  color:#666;
  font-size:12px;
  padding:9px 18px;
  border-radius:30px;
  cursor:pointer;
  opacity:0;
  transition:opacity .6s ease;
}

.replay-btn.show{
  opacity:1;
}

/* ================= HEART ================= */

.heart{
  position:fixed;
  bottom:-30px;
  font-size:18px;
  opacity:.75;
  animation:rise linear forwards;
  pointer-events:none;
  z-index:50;
}

@keyframes rise{
  from{
    transform:translateY(0) rotate(0);
    opacity:0;
  }

  15%{
    opacity:.75;
  }

  to{
    transform:translateY(-110vh) rotate(25deg);
    opacity:0;
  }
}
</style>
</head>
