<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Patrick+Hand&display=swap');

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:"Plus Jakarta Sans",sans-serif;
  background:#ffffff;
}

body{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= GLOBAL STAGE ================= */

.stage{
  position:fixed;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;
  padding:8vw;

  opacity:0;
  visibility:hidden;
  pointer-events:none;

  transition:opacity .6s ease;
  cursor:pointer;
}

.stage.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

.stage.bg-white{
  background:#ffffff;
}

.stage.bg-black{
  background:#000000;
}


/* ================= START SCREEN ================= */

#stageStart p{
  color:#9a9a9a;
  font-size:15px;
  letter-spacing:.5px;
  font-weight:500;
}


/* ================= SENTENCE SCREEN ================= */

#stageSentence .sentence-text{
  color:#1a1a1a;
  font-size:19px;
  font-weight:500;
  line-height:1.6;

  max-width:520px;

  opacity:0;
  transform:translateY(8px);

  transition:
    opacity .5s ease,
    transform .5s ease;
}

#stageSentence .sentence-text.show{
  opacity:1;
  transform:translateY(0);
}

.tap-hint{
  position:absolute;
  bottom:9%;
  left:0;
  right:0;

  color:#c7c7c7;
  font-size:11px;
  letter-spacing:.5px;
}


/* ================= BLACK TRANSITION ================= */

#stageBlack::after{
  content:"";

  width:6px;
  height:6px;

  border-radius:50%;

  background:#ffffff;
  opacity:.6;
}


/* ================= LYRIC SCREEN ================= */

#stageLyric{
  overflow:hidden;

  /* LIRIK TIDAK BISA DIGANTI DENGAN TAP */
  cursor:default;

  user-select:none;
  -webkit-user-select:none;

  /* Sentuhan layar tidak melakukan apa-apa */
  touch-action:none;
}

.lyric-wrap{
  position:relative;
  max-width:640px;
  padding:20px;
}

.lyric-line{
  font-size:9vw;
  font-weight:800;
  line-height:1.05;

  color:#111111;

  opacity:0;
  transform:scale(.7);

  display:inline-block;

  transition:
    opacity .5s ease,
    transform .5s cubic-bezier(.2,.9,.3,1.2);
}

.lyric-line.show{
  opacity:1;
  transform:scale(1);
}

@media(min-width:600px){
  .lyric-line{
    font-size:52px;
  }
}


/* ================= PHOTO ================= */

#stagePhoto{
  flex-direction:column;
  padding:6vw;
}

.photo-card{
  width:min(78vw,340px);

  border-radius:14px;
  overflow:hidden;

  box-shadow:0 20px 40px #00000022;

  margin-bottom:18px;

  opacity:0;
  transform:translateY(18px) rotate(-2deg);

  transition:
    opacity .6s ease,
    transform .6s cubic-bezier(.2,.9,.3,1.1);

  background:#f2f2f2;
}

.photo-card.show{
  opacity:1;
  transform:translateY(0) rotate(-2deg);
}

.photo-card img{
  width:100%;
  display:block;

  aspect-ratio:4/5;
  object-fit:cover;
}

.photo-caption{
  color:#8a8a8a;

  font-size:13px;

  margin-top:2px;
  margin-bottom:0;

  opacity:0;

  transition:opacity .5s ease .15s;

  min-height:18px;
}

.photo-caption.show{
  opacity:1;
}

.photo-dots{
  display:flex;
  gap:6px;

  margin-top:16px;

  opacity:0;

  transition:opacity .5s ease;
}

.photo-dots.show{
  opacity:1;
}

.photo-dots span{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#e2e2e2;
}

.photo-dots span.on{
  background:#b7b7b7;
}

.replay-btn{
  margin-top:18px;

  border:1px solid #dcdcdc;

  background:#ffffff;

  color:#666666;

  font-size:12px;

  padding:9px 18px;

  border-radius:30px;

  cursor:pointer;

  opacity:0;

  transition:opacity .6s ease .4s;
}

.replay-btn.show{
  opacity:1;
}


/* ================= HEART ================= */

.heart{
  position:fixed;

  bottom:-30px;

  font-size:18px;

  opacity:.75;

  animation:rise linear forwards;

  pointer-events:none;

  z-index:50;
}

@keyframes rise{

  from{
    transform:translateY(0) rotate(0);
    opacity:0;
  }

  15%{
    opacity:.75;
  }

  to{
    transform:translateY(-110vh) rotate(25deg);
    opacity:0;
  }

}
</style>
</head>

</div>
