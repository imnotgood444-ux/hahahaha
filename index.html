<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ♡</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Patrick+Hand&display=swap');

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:"Plus Jakarta Sans",sans-serif;
  background:#fff;
}

body{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ================= STAGE ================= */

.stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:8vw;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .6s ease;
}

.stage.active{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

.stage.bg-white{
  background:#fff;
}

.stage.bg-black{
  background:#000;
}

/* ================= START ================= */

#stageStart p{
  color:#9a9a9a;
  font-size:15px;
  letter-spacing:.5px;
  font-weight:500;
}

/* ================= SENTENCE ================= */

#stageSentence .sentence-text{
  color:#1a1a1a;
  font-size:19px;
  font-weight:500;
  line-height:1.6;
  max-width:520px;
  opacity:0;
  transform:translateY(8px);
  transition:opacity .5s ease,transform .5s ease;
}

#stageSentence .sentence-text.show{
  opacity:1;
  transform:translateY(0);
}

.tap-hint{
  position:absolute;
  bottom:9%;
  left:0;
  right:0;
  color:#c7c7c7;
  font-size:11px;
  letter-spacing:.5px;
}

/* ================= BLACK ================= */

#stageBlack::after{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:#fff;
  opacity:.6;
}

/* ================= LYRICS ================= */

#stageLyric{
  overflow:hidden;
  cursor:default;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

.lyric-wrap{
  position:relative;
  max-width:640px;
  padding:20px;
}

.lyric-line{
  font-size:9vw;
  font-weight:800;
  line-height:1.05;
  color:#111;
  opacity:0;
  transform:scale(.7);
  display:inline-block;
  transition:
    opacity .5s ease,
    transform .5s cubic-bezier(.2,.9,.3,1.2);
}

.lyric-line.show{
  opacity:1;
  transform:scale(1);
}

@media(min-width:600px){
  .lyric-line{
    font-size:52px;
  }
}

/* ================= INSTAGRAM STYLE ================= */

#stagePhoto{
  background:#fff;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.ig-post{
  width:min(100%,430px);
  height:100%;
  background:#fff;
  display:flex;
  flex-direction:column;
}

/* Header */

.ig-header{
  height:58px;
  display:flex;
  align-items:center;
  padding:0 14px;
  border-bottom:1px solid #eee;
  flex-shrink:0;
}

.ig-header-info{
  flex:1;
  display:flex;
  flex-direction:column;
}

.username-row{
  display:flex;
  align-items:center;
  gap:4px;
}

.verified{
  width:13px;
  height:13px;
  flex-shrink:0;
}

.subtext{
  font-size:11px;
  color:#8e8e8e;
  margin-top:1px;
}

.menu-dots{
  padding:8px;
  color:#262626;
}

.profile{
  width:34px;
  height:34px;
  border-radius:50%;
  background:linear-gradient(135deg,#ffb6c1,#d9a7ff,#8fd3ff);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:700;
  font-size:14px;
  margin-right:10px;
}

.username{
  font-size:13px;
  font-weight:700;
  color:#222;
}

/* Photo */

.ig-photo-area{
  width:100%;
  position:relative;
  background:#f4f4f4;
  overflow:hidden;
}

#photoImg{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  opacity:0;
  transform:scale(1.03);
  transition:
    opacity .45s ease,
    transform .55s ease;
}

#photoImg.show{
  opacity:1;
  transform:scale(1);
}

/* Dots */

.photo-dots{
  position:absolute;
  bottom:10px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:5px;
}

.photo-dots span{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#ffffffaa;
  transition:.25s ease;
}

.photo-dots span.on{
  background:#fff;
  transform:scale(1.15);
}

/* Arrow */

.photo-arrow{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  width:30px;
  height:30px;
  border-radius:50%;
  background:#00000055;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  opacity:.8;
  transition:opacity .3s ease;
}

.photo-arrow.hide{
  opacity:0;
}

/* Bottom */

.ig-bottom{
  padding:10px 14px 12px;
  text-align:left;
}

.ig-icons{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

.ig-icons-left{
  display:flex;
  align-items:center;
  gap:14px;
}

.icon-btn{
  cursor:pointer;
  color:#262626;
  display:flex;
  transition:transform .15s ease, color .15s ease;
}

.icon-btn svg{
  width:24px;
  height:24px;
}

.icon-btn.liked{
  color:#ed4956;
  transform:scale(1.1);
}

.icon-btn.liked svg{
  fill:#ed4956;
}

.ig-likes{
  font-size:13px;
  font-weight:700;
  color:#222;
  margin-bottom:4px;
}

.ig-caption{
  font-size:13px;
  line-height:1.5;
  color:#222;
  min-height:40px;
}

.ig-caption b{
  margin-right:5px;
}

.ig-date{
  color:#999;
  font-size:10px;
  margin-top:7px;
}

/* Replay */

.replay-btn{
  margin:12px auto 0;
  border:1px solid #ddd;
  background:#fff;
  color:#666;
  font-size:12px;
  padding:9px 18px;
  border-radius:30px;
  cursor:pointer;
  opacity:0;
  transition:opacity .6s ease;
}

.replay-btn.show{
  opacity:1;
}

/* ================= BOTTOM NAV (ala app IG) ================= */

.ig-nav{
  margin-top:auto;
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:12px 10px;
  border-top:1px solid #eee;
  flex-shrink:0;
}

.ig-nav svg{
  width:24px;
  height:24px;
  color:#262626;
}

.ig-nav .nav-avatar{
  width:22px;
  height:22px;
  border-radius:50%;
  background:linear-gradient(135deg,#ffb6c1,#d9a7ff,#8fd3ff);
  border:1.5px solid #262626;
}

/* ================= HEART ================= */

.heart{
  position:fixed;
  bottom:-30px;
  font-size:18px;
  opacity:.75;
  animation:rise linear forwards;
  pointer-events:none;
  z-index:50;
}

@keyframes rise{
  from{
    transform:translateY(0) rotate(0);
    opacity:0;
  }

  15%{
    opacity:.75;
  }

  to{
    transform:translateY(-110vh) rotate(25deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<audio id="bgMusic" src="music.mp3" preload="auto"></audio>

<!-- ================= START ================= -->

<div class="stage bg-white active" id="stageStart">
  <p>tekan untuk lanjut</p>
</div>

<!-- ================= SENTENCE ================= -->

<div class="stage bg-white" id="stageSentence">
  <div class="sentence-text" id="sentenceText"></div>
  <div class="tap-hint">tap untuk lanjut</div>
</div>

<!-- ================= BLACK ================= -->

<div class="stage bg-black" id="stageBlack"></div>

<!-- ================= LYRICS ================= -->

<div class="stage bg-white" id="stageLyric">
  <div class="lyric-wrap">
    <span class="lyric-line" id="lyricLine"></span>
  </div>
</div>

<!-- ================= INSTAGRAM POST ================= -->

<div class="stage bg-white" id="stagePhoto">

  <div class="ig-post">

    <div class="ig-header">

      <div class="profile">
        O
      </div>

      <div class="ig-header-info">
        <div class="username-row">
          <span class="username">opie ♡</span>
          <svg class="verified" viewBox="0 0 24 24" fill="#3897f0"><path d="M12 2 14.4 4.1 17.5 3.4 18.6 6.4 21.6 7.5 20.9 10.6 23 13 20.9 15.4 21.6 18.5 18.6 19.6 17.5 22.6 14.4 21.9 12 24 9.6 21.9 6.5 22.6 5.4 19.6 2.4 18.5 3.1 15.4 1 13 3.1 10.6 2.4 7.5 5.4 6.4 6.5 3.4 9.6 4.1Z"/><path d="M9.5 12.3 11.2 14 14.8 9.8" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="subtext">Disarankan untuk kamu</div>
      </div>

      <div class="menu-dots">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </div>

    </div>

    <div class="ig-photo-area" id="igPhotoArea">

      <img id="photoImg" src="" alt="">

      <div class="photo-arrow" id="photoArrow">
        ›
      </div>

      <div class="photo-dots" id="photoDots">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

    </div>

    <div class="ig-bottom">

      <div class="ig-icons">

        <div class="ig-icons-left">

          <span class="icon-btn" id="likeBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.2 2 4.5 5.6 4.5c2 0 3.4 1 4.4 2.5 1-1.5 2.4-2.5 4.4-2.5 3.6 0 5.2 3.7 3.6 7.2C19.5 16.4 12 21 12 21Z"/></svg>
          </span>

          <span class="icon-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-3.9-.9L3 21l1.9-5.6A8.4 8.4 0 0 1 3.5 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5Z"/></svg>
          </span>

          <span class="icon-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
          </span>

        </div>

        <span class="icon-btn" id="saveBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12a1 1 0 0 1 1 1V21l-7-4-7 4V4.5a1 1 0 0 1 1-1Z"/></svg>
        </span>

      </div>

      <div class="ig-likes" id="igLikes">
        Disukai oleh <b>opie</b> dan lainnya
      </div>

      <div class="ig-caption">
        <b>opie ♡</b>
        <span id="photoCaption"></span>
      </div>

      <div class="ig-date">
        memories ♡
      </div>

      <button class="replay-btn" id="replayBtn">
        ↻ ulangi dari awal
      </button>

    </div>

    <div class="ig-nav">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11h3v9h6v-6h2v6h6v-9h3Z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7.5"/><path d="M21 21 16.5 16.5" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m7 9 5 3.2L17 9" stroke-linecap="round"/></svg>
      <span class="nav-avatar"></span>
    </div>

  </div>

</div>

<script>

/* =====================================================
   KALIMAT PEMBUKA
   ===================================================== */

const SENTENCES = [

  "aku sebenarnya nggak tahu harus mulai dari mana",

  "tapi aku cuma mau kamu tahu satu hal",

  "kamu itu salah satu hal terbaik yang pernah aku temui",

  "makasih udah jadi bagian dari cerita aku, Opie",

  "ini bukan cuma pesan biasa..."

];


/* =====================================================
   LIRIK
   ===================================================== */

const LYRIC_LINES = [

  "melihatmu bersemi dan bermekaran",

  "tawa candamu berikan kekuatan",

  "sisa hariku pagi berganti waktu",

  "memelukmu",

  "kita kan tua dan kehilangan pegangan",

  "lihat senyummu memberikan kekuatan",

  "sisa nafasku cinta tak kenal waktu"

];

/* Detik kemunculan tiap baris di atas (dihitung dari saat
   music.mp3 mulai diputar). Kalau ada baris tertentu yang masih
   meleset dari lagunya, geser saja angkanya di sini (dalam
   detik, boleh pakai koma desimal) — index 0 = baris pertama. */
const LYRIC_TIMES = [1.2, 8.57, 16.61, 24.91, 31.99, 40.08, 47.33];

/* Detik saat halaman pindah dari lirik ke foto. */
const PHOTO_STAGE_TIME = 50.5;


/* =====================================================
   FOTO
   Diarahkan ke foto1.jpg – foto4.jpg di folder yang sama
   dengan file HTML ini. Ganti teks caption sesuai momennya.
   ===================================================== */

const PHOTOS = [
  {
    src: "foto1.jpg",
    caption: "Hai"
  },
  {
    src: "foto2.jpg",
    caption: "Opie"
  },
  {
    src: "foto3.jpg",
    caption: "I miss u"
  },
  {
    src: "foto4.jpg",
    caption: "I love u"
  }
];


/* =====================================================
   ELEMEN
   ===================================================== */

const stageStart    = document.getElementById("stageStart");
const stageSentence = document.getElementById("stageSentence");
const sentenceText  = document.getElementById("sentenceText");
const stageBlack    = document.getElementById("stageBlack");
const stageLyric    = document.getElementById("stageLyric");
const lyricLine     = document.getElementById("lyricLine");
const stagePhoto    = document.getElementById("stagePhoto");
const igPhotoArea   = document.getElementById("igPhotoArea");
const photoImg      = document.getElementById("photoImg");
const photoArrow    = document.getElementById("photoArrow");
const photoCaption  = document.getElementById("photoCaption");
const photoDots     = document.getElementById("photoDots");
const likeBtn       = document.getElementById("likeBtn");
const igLikes       = document.getElementById("igLikes");
const replayBtn     = document.getElementById("replayBtn");
const bgMusic       = document.getElementById("bgMusic");


/* =====================================================
   STATE
   ===================================================== */

let sentenceIndex = 0;
let photoIndex = 0;
let liked = false;


/* =====================================================
   HELPER
   ===================================================== */

function goToStage(stageEl){
  document.querySelectorAll(".stage").forEach(function(s){
    s.classList.remove("active");
  });
  stageEl.classList.add("active");
}

function spawnHeart(){
  const h = document.createElement("div");
  h.className = "heart";
  h.textContent = Math.random() > 0.5 ? "♡" : "♥";
  h.style.left = (10 + Math.random() * 80) + "vw";
  h.style.animationDuration = (5 + Math.random() * 4) + "s";
  h.style.fontSize = (14 + Math.random() * 13) + "px";
  document.body.appendChild(h);
  setTimeout(function(){ h.remove(); }, 9500);
}


/* =====================================================
   1. START
   ===================================================== */

stageStart.addEventListener("click", function(){
  goToStage(stageSentence);
  showSentence(0);
});


/* =====================================================
   2. KALIMAT PEMBUKA
   ===================================================== */

function showSentence(i){
  sentenceText.classList.remove("show");
  setTimeout(function(){
    sentenceText.textContent = SENTENCES[i];
    sentenceText.classList.add("show");
  }, 280);
}

stageSentence.addEventListener("click", function(){
  sentenceIndex++;

  if(sentenceIndex < SENTENCES.length){
    showSentence(sentenceIndex);
  } else {
    goToStage(stageBlack);
    setTimeout(function(){
      goToStage(stageLyric);
      startLyrics();
    }, 900);
  }
});


/* =====================================================
   4. LIRIK
   ===================================================== */

function startLyrics(){
  bgMusic.currentTime = 0;
  bgMusic.play().catch(function(){});

  LYRIC_TIMES.forEach(function(t, i){
    setTimeout(function(){
      lyricLine.classList.remove("show");
      setTimeout(function(){
        lyricLine.textContent = LYRIC_LINES[i];
        lyricLine.classList.add("show");
      }, 200);
    }, Math.max(0, t * 1000 - 200));
  });

  setTimeout(function(){
    lyricLine.classList.remove("show");
  }, (PHOTO_STAGE_TIME - 1) * 1000);

  setTimeout(function(){
    goToStage(stagePhoto);
    showPhoto(0);
  }, PHOTO_STAGE_TIME * 1000);
}


/* =====================================================
   5. FOTO (Instagram-style, tap untuk lanjut)
   ===================================================== */

function showPhoto(i){
  photoIndex = i;

  photoImg.classList.remove("show");

  setTimeout(function(){
    photoImg.src = PHOTOS[i].src;
    photoImg.alt = PHOTOS[i].caption;
    photoCaption.textContent = PHOTOS[i].caption;

    photoImg.classList.add("show");

    updateDots(i);
    spawnHeart();
  }, 200);

  if(i === PHOTOS.length - 1){
    photoArrow.classList.add("hide");
    setTimeout(function(){
      replayBtn.classList.add("show");
    }, 900);
  } else {
    photoArrow.classList.remove("hide");
  }
}

function updateDots(i){
  const dots = photoDots.querySelectorAll("span");
  dots.forEach(function(d, idx){
    d.classList.toggle("on", idx === i);
  });
}

igPhotoArea.addEventListener("click", function(){
  if(photoIndex < PHOTOS.length - 1){
    showPhoto(photoIndex + 1);
  }
});

likeBtn.addEventListener("click", function(e){
  e.stopPropagation();
  liked = !liked;
  likeBtn.classList.toggle("liked", liked);
  igLikes.innerHTML = liked
    ? "Disukai oleh <b>kamu</b> dan <b>opie</b>"
    : "Disukai oleh <b>opie</b> dan lainnya";
  if(liked) spawnHeart();
});


/* =====================================================
   ULANGI DARI AWAL
   ===================================================== */

replayBtn.addEventListener("click", function(e){
  e.stopPropagation();

  bgMusic.pause();
  bgMusic.currentTime = 0;

  sentenceIndex = 0;
  photoIndex = 0;
  liked = false;

  sentenceText.classList.remove("show");
  lyricLine.classList.remove("show");
  photoImg.classList.remove("show");
  replayBtn.classList.remove("show");
  photoArrow.classList.remove("hide");
  likeBtn.classList.remove("liked");
  igLikes.innerHTML = "Disukai oleh <b>opie</b> dan lainnya";

  goToStage(stageStart);
});

</script>
</body>
</html>
